<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radha Jha | Professional Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a1a1a;
            --secondary-dark: #2d2d2d;
            --accent: #0056b3;
            --text-light: #f8f9fa;
            --text-muted: #6c757d;
            --bg-subtle: #f4f4f4;
        }

        body {
            background-color: var(--bg-subtle);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: var(--primary-dark);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary-dark);
            position: relative;
        }

        .profile-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(20%);
            border: 2px solid var(--bg-subtle);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 10px;
            letter-spacing: -0.5px;
        }

        .link-text {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
            transition: opacity 0.2s;
        }

        .link-text:hover {
            opacity: 0.7;
        }

        .msg-box {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 25px 0;
            margin-bottom: 30px;
        }

        .msg-box h1 {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.6;
            color: var(--secondary-dark);
            text-shadow: none;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-btn {
            color: var(--primary-dark);
            text-decoration: none;
            font-size: 1.3rem;
            transition: color 0.2s, transform 0.2s;
        }

        .social-btn:hover {
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="profile-wrapper">
                <img src="Profile.jpg" alt="Designer" class="profile-img">
            </div>

            <h1>Radha Jha</h1>
            <a href="https://radhajha4228.github.io/ETHILEMMA/" class="link-text" target="_blank">
                Visit ETHILEMMA <i class="fas fa-arrow-right" style="font-size: 0.7rem; margin-left: 5px;"></i>
            </a>

            <div class="msg-box">
                <h1>"Hi! I'm a web designer who loves gumbo of thinking and learning. Welcome to magical world of Ethilemma!"</h1>
                <h1 style="margin-top: 15px; font-weight: 600; color: var(--primary-dark);">Make Love, Not War<br>Express, not evaluate</h1>
            </div>

            <div class="social-bar">
                <a href="https://www.instagram.com/_radhajha4228?igsh=cjlxZmVweGN6b2Mw" class="social-btn" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://github.com/radhajha4228" class="social-btn" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="mailto:rj6730500@gmail.com" class="social-btn" title="Email"><i class="far fa-envelope"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
